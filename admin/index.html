<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salu-Salo Admin</title>
  <meta name="description" content="Salu-Salo admin dashboard. Reads Salu-Salo through admin-only server functions.">
  <meta name="theme-color" content="#fcfbf6">
  <link rel="icon" type="image/webp" href="assets/salusalo-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="signin" id="signin" hidden>
    <form class="signin__card" id="signin-form" novalidate>
      <span class="logo signin__logo"><img src="assets/salusalo-logo.webp" alt="" width="56" height="56"></span>
      <h1 class="signin__title">Salu-Salo Admin</h1>
      <p class="signin__sub">Sign in with your admin account.</p>
      <p class="signin__msg" id="signin-msg" role="alert" hidden></p>
      <label class="field"><span class="field__label">Email</span><input class="input" id="signin-email" type="email" autocomplete="username" required></label>
      <label class="field"><span class="field__label">Password</span><input class="input" id="signin-password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn--primary" id="signin-submit" type="submit">Sign in</button>
      <div class="signin__or"><span>or</span></div>
      <button class="btn btn--secondary" id="signin-google" type="button">Continue with Google</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
      <div class="sidebar__brand">
        <span class="logo"><img src="assets/salusalo-logo.webp" alt="" width="40" height="40"></span>
        <span class="brand-text"><span class="wordmark">Salu-Salo</span><span class="brand-tag">Admin dashboard</span></span>
      </div>
      <nav class="nav" aria-label="Main">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>
      <div class="sidebar__foot">
        <button class="btn btn--ghost collapse-btn" id="collapse-btn" type="button" aria-controls="sidebar">
          <span data-icon="keyboardDoubleArrowLeft"></span><span class="collapse-btn__label">Collapse menu</span>
        </button>
        <a class="profile" id="profile-link" href="#/settings">
          <span class="avatar" id="profile-avatar" aria-hidden="true">SA</span>
          <span class="profile__text"><span class="profile__name" id="profile-name">Salu-Salo Admin</span><span class="profile__role">Administrator</span></span>
        </a>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
        <p class="topbar__title" id="topbar-title">Overview</p>
        <span class="topbar__spacer"></span>
        <div class="topbar__actions">
          <a class="icon-btn bell" id="bell" href="#/reports" aria-label="Reports"><span data-icon="flag"></span><span class="bell__dot" id="bell-dot" hidden></span></a>
        </div>
      </header>
      <main class="content" id="main" tabindex="-1">
        <noscript><p>The Salu-Salo admin dashboard needs JavaScript.</p></noscript>
      </main>
    </div>
  </div>

  <div id="panel-root"></div>
  <div id="dialog-root"></div>
  <div class="toasts"><div id="toast-root" role="status" aria-live="polite"></div><div id="toast-alerts" role="alert" aria-live="assertive"></div></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" integrity="sha384-ZaR6mWzmJtrRibZ1Vm7SoHFr8OXjyAuGAXalGDKqbxFT18oi/z+oZLIRFkpeNor1" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/list-view.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/listings.js"></script>
  <script src="js/pages/reservations.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/notifications.js"></script>
  <script src="js/pages/audit.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
